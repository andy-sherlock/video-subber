[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-subber-web"
version = "2.0.0"
description = "视频中文字幕生成 — Web 版"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "faster-whisper>=1.0",
    "deep-translator>=1.11",
    "resemblyzer>=0.1",
    "librosa>=0.10",
    "cryptography>=44.0",
    "websockets>=14.0",
]

[project.scripts]
video-subber-web = "backend.main:run"
