[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-subber-web"
version = "3.09"
description = "视频中文字幕生成 — Web 版"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.47.0",
    "python-multipart==0.0.29",
    "faster-whisper==1.2.1",
    "mlx-whisper>=0.4.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "modelscope==1.37.1",
    "deep-translator==1.11.4",
    "resemblyzer==0.1.4",
    "librosa==0.11.0",
    "cryptography==48.0.0",
    "websockets==16.0",
    "qwen-asr==0.0.6",
    "mlx-qwen3-asr>=0.3.5",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "yt-dlp==2026.8.19",
    "yt-dlp-ejs==0.8.0",
    # G12 第三批 B（排版 §12.8、决定 20/27）：规则 D 在两个汉字之间换行要用分词；加载失败自动退回原来的换行
    "jieba==0.42.1",
    "zhconv==1.4.3",
    # G12 第三批 B 收尾 ⓪：SenseVoice 声音分类要用 funasr，funasr 读音频特征要用 torchaudio；此前不在清单里，照锁文件全新安装会缺
    "funasr==1.3.14",
    "torchaudio==2.11.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[project.scripts]
video-subber-web = "backend.main:run"
